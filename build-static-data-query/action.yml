name: 'Build Static Data Query'
description: 'GitHub Action for building and processing static data queries'
author: 'Stanislav'

inputs:
  game:
    description: 'The slug of the current game'
    required: true
  game-url-slug:
    description: 'The url slug of the current game. In some cases (for example 2xko) url slug may be different from the game slug. If not provided, the "game" input will be used.'
    required: false
  graphql-endpoint:
    description: 'GraphQL endpoint URL'
    required: true
  static-data-field-name:
    description: 'Name of the static data field in schema'
    required: false
    default: 'staticData'
  timeout:
    description: 'Timeout for each Claude Code run in milliseconds'
    required: false
    default: '600000'
  model-version:
    description: 'Claude model alias or full model id, passed to claude --model'
    required: false
    default: 'sonnet'
  gcs-bucket-name:
    description: 'Google Cloud Storage bucket name for uploading build files'
    required: true
  gcs-project-id:
    description: 'Google Cloud Project id'
    required: true
  dynamic-modules-env:
    description: 'Environment for dynamic modules (e.g., prod, staging, dev)'
    required: true
  gcp-service-account-json:
    description: 'Google Cloud Service Account JSON credentials'
    required: true
  query-module-version:
    description: 'Dynamic module to build: v2 (static-data-query-v2, fragments written by the LLM) or v3 (static-data-query-v3, fragments generated deterministically from the schema)'
    required: false
    default: 'v2'

runs:
  using: 'composite'
  steps:
    - name: Install Claude Code
      run: |
        curl -fsSL https://claude.ai/install.sh | bash -s 2.1.325
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      shell: bash

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: ${{ inputs.gcp-service-account-json }}

    - name: Set up Google Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Run build script
      run: node dist/index.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_GAME: ${{ inputs.game }}
        INPUT_GAME-URL-SLUG: ${{ inputs.game-url-slug }}
        INPUT_GRAPHQL-ENDPOINT: ${{ inputs.graphql-endpoint }}
        INPUT_STATIC-DATA-FIELD-NAME: ${{ inputs.static-data-field-name }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MODEL-VERSION: ${{ inputs.model-version }}
        INPUT_GCS-BUCKET-NAME: ${{ inputs.gcs-bucket-name }}
        INPUT_GCS-PROJECT-ID: ${{ inputs.gcs-project-id }}
        INPUT_DYNAMIC-MODULES-ENV: ${{ inputs.dynamic-modules-env }}
        INPUT_QUERY-MODULE-VERSION: ${{ inputs.query-module-version }}
