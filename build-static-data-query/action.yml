name: 'Build Static Data Query'
description: 'GitHub Action for building and processing static data queries'
author: 'Stanislav'

inputs:
  game:
    description: 'The slug of the current game'
    required: true
  graphql-endpoint:
    description: 'GraphQL endpoint URL'
    required: true
  static-data-field-name:
    description: 'Name of the static data field in schema'
    required: false
    default: 'staticData'
  timeout:
    description: 'Timeout for cursor-agent execution in milliseconds'
    required: false
    default: '600000'

runs:
  using: 'node20'
  main: 'dist/index.js'
