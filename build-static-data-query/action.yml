name: 'Build Static Data Query'
description: 'GitHub Action for building and processing static data queries'
author: 'Stanislav'

inputs:
  game:
    description: 'The slug of the current game'
    required: true
  game-url-slug:
    description: 'The url slug of the current game. In some cases (for example 2xko) url slug may be different from the game slug. If not provided, the "game" input will be used.'
    required: false
  graphql-endpoint:
    description: 'GraphQL endpoint URL'
    required: true
  static-data-field-name:
    description: 'Name of the static data field in schema'
    required: false
    default: 'staticData'
  timeout:
    description: 'Timeout for cursor-agent execution in milliseconds'
    required: false
    default: '600000'
  model-version:
    description: 'LLM model version to use'
    required: false
    default: 'sonnet-4.5'
  gcs-bucket-name:
    description: 'Google Cloud Storage bucket name for uploading build files'
    required: true
  gcs-project-id:
    description: 'Google Cloud Project id'
    required: true
  dynamic-modules-env:
    description: 'Environment for dynamic modules (e.g., prod, staging, dev)'
    required: true
  gcp-service-account-json:
    description: 'Google Cloud Service Account JSON credentials'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install cursor-cli
      run: |
        curl -fsSL https://cursor.com/install | bash
        echo "$HOME/.cursor/bin" >> $GITHUB_PATH
      shell: bash

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: ${{ inputs.gcp-service-account-json }}

    - name: Set up Google Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Probe Google auth/storage connectivity
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        echo "::group::Runtime"
        node --version
        echo "global fetch type: $(node -e 'console.log(typeof fetch)')"
        echo "::endgroup::"

        echo "::group::curl probes (http_code != 000 means the host is reachable)"
        for url in \
          https://www.googleapis.com/oauth2/v4/token \
          https://oauth2.googleapis.com/token \
          https://storage.googleapis.com ; do
          echo "--- $url"
          curl -sS -o /dev/null -w "http_code=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" \
            -m 20 "$url" -d '' || echo "curl FAILED for $url"
        done
        echo "::endgroup::"

        echo "::group::node fetch probe (same URL gtoken/gaxios uses)"
        node -e '
          const url = "https://www.googleapis.com/oauth2/v4/token";
          fetch(url, { method: "POST" })
            .then(async r => { console.log("node fetch status:", r.status); await r.text().catch(() => {}); })
            .catch(e => {
              console.log("node fetch FAILED:", e && e.name, e && e.message);
              let c = e && e.cause, depth = 0;
              while (c && depth < 5) { console.log("  caused by:", c.name, c.message, c.code || ""); c = c.cause; depth++; }
            });
        ' || true
        echo "::endgroup::"

    - name: Run build script
      run: node dist/index.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_GAME: ${{ inputs.game }}
        INPUT_GAME-URL-SLUG: ${{ inputs.game-url-slug }}
        INPUT_GRAPHQL-ENDPOINT: ${{ inputs.graphql-endpoint }}
        INPUT_STATIC-DATA-FIELD-NAME: ${{ inputs.static-data-field-name }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MODEL-VERSION: ${{ inputs.model-version }}
        INPUT_GCS-BUCKET-NAME: ${{ inputs.gcs-bucket-name }}
        INPUT_GCS-PROJECT-ID: ${{ inputs.gcs-project-id }}
        INPUT_DYNAMIC-MODULES-ENV: ${{ inputs.dynamic-modules-env }}
