name: desktop-manifest-publish CI

# Runs the action's own typecheck + unit tests on changes to it.
# (The action itself never runs these — they guard the validator code on PR/push.)
on:
  push:
    branches: [main]
    paths:
      - 'desktop-manifest-publish/**'
      - '.github/workflows/desktop-manifest-publish-ci.yml'
  pull_request:
    paths:
      - 'desktop-manifest-publish/**'
      - '.github/workflows/desktop-manifest-publish-ci.yml'

jobs:
  test:
    name: typecheck & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-manifest-publish
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-manifest-publish/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
