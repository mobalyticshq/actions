name: 'Build Static Data Mapping'
description: 'GitHub Action for building static data mapping according to prompt'
author: 'Stanislav'

inputs:
  game:
    description: 'The slug of the current game'
    required: true
  timeout:
    description: 'Timeout for cursor-agent execution in milliseconds'
    required: false
    default: '600000'
  gcs-bucket-name:
    description: 'Google Cloud Storage bucket name for uploading build files'
    required: true
  gcs-project-id:
    description: 'Google Cloud Project id'
    required: true
  dynamic-modules-env:
    description: 'Environment for dynamic modules (e.g., prod, staging, dev)'
    required: true
  gcp-service-account-json:
    description: 'Google Cloud Service Account JSON credentials'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install cursor-cli
      run: |
        curl -fsSL https://cursor.com/install | bash
        echo "$HOME/.cursor/bin" >> $GITHUB_PATH
      shell: bash

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: ${{ inputs.gcp-service-account-json }}

    - name: Set up Google Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Run build script
      run: node dist/index.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_GAME: ${{ inputs.game }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_GCS-BUCKET-NAME: ${{ inputs.gcs-bucket-name }}
        INPUT_GCS-PROJECT-ID: ${{ inputs.gcs-project-id }}
        INPUT_DYNAMIC-MODULES-ENV: ${{ inputs.dynamic-modules-env }}
