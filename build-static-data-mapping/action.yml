name: 'Build Static Data Mapping'
description: 'GitHub Action for building static data mapping according to prompt'
author: 'Stanislav'

inputs:
  game:
    description: 'The slug of the current game'
    required: true
  game-url-slug:
    description: 'The url slug of the current game. In some cases (for example 2xko) url slug may be different from the game slug. If not provided, the "game" input will be used.'
    required: false
  configuration-game-slug:
    description: 'The root folder in the ngf-configurations repository. Optional. If not provided, the "game" input will be used'
    required: false
  graphql-endpoint:
    description: 'GraphQL endpoint URL'
    required: true
  timeout:
    description: 'Timeout for cursor-agent execution in milliseconds'
    required: false
    default: '600000'
  model-version:
    description: 'LLM model version to use'
    required: false
    default: 'sonnet-4.5'
  gcs-bucket-name:
    description: 'Google Cloud Storage bucket name for uploading build files'
    required: true
  gcs-project-id:
    description: 'Google Cloud Project id'
    required: true
  gcp-service-account-json:
    description: 'Google Cloud Service Account JSON credentials'
    required: true
  dynamic-modules-env:
    description: 'Environment for dynamic modules (e.g., prod, staging, dev)'
    required: true
  disable-query-ast-compilation:
    description: 'When true (v2 mode), download query artifacts from the static-data-query-v2 module and consume the query as a plain string instead of a compiled AST (the integration test uses the query string directly, without graphql print()). When false (default), download from static-data-query and use the compiled AST. The mapping module is always published under the static-data-mapping slug regardless of this flag.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install cursor-cli
      run: |
        curl -fsSL https://cursor.com/install | bash
        echo "$HOME/.cursor/bin" >> $GITHUB_PATH
      shell: bash

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Authenticate to Google Cloud
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: ${{ inputs.gcp-service-account-json }}

    - name: Set up Google Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Run build script
      run: node dist/index.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_GAME: ${{ inputs.game }}
        INPUT_GAME-URL-SLUG: ${{ inputs.game-url-slug }}
        INPUT_CONFIGURATION-GAME-SLUG: ${{ inputs.configuration-game-slug }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_MODEL-VERSION: ${{ inputs.model-version }}
        INPUT_GCS-BUCKET-NAME: ${{ inputs.gcs-bucket-name }}
        INPUT_GCS-PROJECT-ID: ${{ inputs.gcs-project-id }}
        INPUT_DYNAMIC-MODULES-ENV: ${{ inputs.dynamic-modules-env }}
        INPUT_DISABLE-QUERY-AST-COMPILATION: ${{ inputs.disable-query-ast-compilation }}

    - name: Run webpack build for generated mapping
      run: npm run build:mapping
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Run tests
      run: npm test
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GRAPHQL_ENDPOINT: ${{ inputs.graphql-endpoint }}
        DISABLE_QUERY_AST_COMPILATION: ${{ inputs.disable-query-ast-compilation }}

    - name: Run upload build script
      run: node dist/upload-build.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_GAME: ${{ inputs.game }}
        INPUT_GAME-URL-SLUG: ${{ inputs.game-url-slug }}
        INPUT_GCS-BUCKET-NAME: ${{ inputs.gcs-bucket-name }}
        INPUT_GCS-PROJECT-ID: ${{ inputs.gcs-project-id }}
        INPUT_DYNAMIC-MODULES-ENV: ${{ inputs.dynamic-modules-env }}
